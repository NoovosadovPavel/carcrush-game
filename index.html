<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarCrush — три в ряд машинки</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <!-- ИГРОВОЙ ИНТЕРФЕЙС -->
    <header id="gameHeader">
      <h1>🚗 CarCrush</h1>
      <div class="level-bar">
        <span class="level-label">Уровень <strong id="levelNum">1</strong>:</span>
        <span id="goalLabel">собери</span>
        <img id="goalIcon" class="goal-icon" src="" alt="">
        <span id="goalName">—</span>
        <div class="progress-bg">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="progress-text" id="progressText">0/12</span>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Счёт</span>
          <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Ходы</span>
          <span class="stat-value" id="moves">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Комбо</span>
          <span class="stat-value" id="combo">x1</span>
        </div>
      </div>
    </header>

    <div class="board-wrapper">
      <canvas id="gameCanvas" width="480" height="480"></canvas>
      <div class="overlay" id="levelOverlay">
        <div class="overlay-content">
          <h2 id="overlayTitle">🎉 Уровень пройден!</h2>
          <div class="overlay-reward" id="rewardText">Отлично! Продолжай в том же духе!</div>
          <div class="overlay-score">Счёт: <span id="finalScore">0</span></div>
          <button id="overlayBtn">▶ Следующий уровень</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="hintBtn">💡 Подсказка</button>
      <button id="shuffleBtn">🔀 Перемешать</button>
      <button id="resetBtn">🔄 Новая игра</button>
    </div>

    <div class="legend" id="gameLegend"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
